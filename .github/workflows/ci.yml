name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_SECRET: $ecretf0rt3sting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP image (cache)
        run: |
          docker build -t app-php:ci -f Dockerfile .

      - name: Start PHP container for tests
        run: |
          docker run -d --name php-ci \
            -e APP_ENV=test \
            -e XDEBUG_MODE=off \
            -v ${{ github.workspace }}:/var/www/html \
            -w /var/www/html app-php:ci tail -f /dev/null

      - name: Composer install (no dev cache interaction)
        run: |
          docker exec php-ci sh -lc "composer install --no-interaction --prefer-dist"

      - name: Warmup cache (test)
        run: |
          docker exec php-ci sh -lc "php bin/console cache:clear --env=test"

      - name: Prepare test database (sqlite)
        run: |
          docker exec php-ci sh -lc "rm -f var/test.db || true"
          docker exec php-ci sh -lc "php bin/console doctrine:schema:create --env=test"

      - name: Run PHPUnit
        run: |
          docker exec php-ci sh -lc "./vendor/bin/phpunit --testdox"

      - name: Stop container
        if: always()
        run: docker rm -f php-ci || true
