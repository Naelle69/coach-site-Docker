services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: test
      APP_SECRET: $ecretf0rt3sting
      MAILER_DSN: smtp://mailer:1025
    depends_on:
      - db
      - mailer

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  mailer:
    image: axllent/mailpit:latest  # UI sur 8025
    ports:
      - "8025:8025"

volumes:
  db_data:
